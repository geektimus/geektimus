<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" width="100%" height="160">
  <style>
    .grid-bg { fill: #161221; rx: 6px; }
    .cell { rx: 2px; }
    .c0 { fill: #231b2e; }
    .c1 { fill: #48235e; }
    .c2 { fill: #79258a; }
    .c3 { fill: #ba289c; }
    .c4 { fill: #e5289e; }
    @keyframes snakeMove {
      0% { transform: translate(0, 0); }
      25% { transform: translate(240px, 0); }
      50% { transform: translate(240px, 48px); }
      75% { transform: translate(480px, 48px); }
      100% { transform: translate(680px, 12px); }
    }
    .snake-head { fill: #00fbfd; filter: drop-shadow(0 0 4px #00fbfd); animation: snakeMove 12s infinite alternate ease-in-out; }
    .snake-body { fill: #e5289e; filter: drop-shadow(0 0 3px #e5289e); animation: snakeMove 12s infinite alternate ease-in-out; animation-delay: -0.15s; }
    .title-text { font: 600 12px "Segoe UI", Ubuntu, sans-serif; fill: #8b799e; }
  </style>

  <rect width="840" height="160" class="grid-bg" />

  <text x="24" y="24" class="title-text">Contribution Graph &amp; Activity</text>

  <!-- Simulated Contribution Matrix Pattern -->
